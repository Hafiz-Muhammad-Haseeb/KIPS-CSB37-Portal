server:
  port: ${SERVER_PORT:8080}
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/KIPS_CSB37}
    username: ${DB_USERNAME:kips_owner}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:3001}
  storage:
    directory: ${UPLOAD_DIRECTORY:./private-uploads}
  encryption:
    key: ${FIELD_ENCRYPTION_KEY:}
  bootstrap:
    admin-username: ${BOOTSTRAP_ADMIN_USERNAME:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
